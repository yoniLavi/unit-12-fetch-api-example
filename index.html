<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Country Explorer</h1>
  <main class="app">
    <form id="searchForm">
      <label for="searchInput">Country name</label>
      <input type="search" id="searchInput" placeholder="Enter country name">
      <button type="submit">Search</button>
    </form>
    <p id="statusText"></p>
    <div id="result"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
